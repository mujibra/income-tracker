<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Arus Finance</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b4d;font:15px system-ui}header{background:#102a43;color:white;padding:24px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #122b4410}.muted{color:#718096;font-size:13px}.money{font-size:24px;font-weight:700;margin-top:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,input,select{padding:11px;border:1px solid #d5deea;border-radius:8px;background:white}button{cursor:pointer;background:#176b58;color:white;border:0}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f5}th{background:#eaf0f6}.negative{color:#c24141}.positive{color:#16815f}form{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}form input,form select{flex:1;min-width:120px}footer{margin:25px 0;color:#718096;font-size:12px}
</style></head><body><header><div><b style="font-size:24px">arus.</b><div class="muted" style="color:#cbd5e1">PERSONAL FINANCE</div></div><span>Pelacak Keuangan Pribadi</span></header><main><h1>Ringkasan</h1><div class="cards"><div class="card"><div class="muted">Saldo bersih (bulan ini)</div><div class="money" id="balance">Rp0</div></div><div class="card"><div class="muted">Pemasukan</div><div class="money positive" id="income">Rp0</div></div><div class="card"><div class="muted">Pengeluaran</div><div class="money negative" id="expense">Rp0</div></div></div><h2>Tambah transaksi</h2><form id="form"><input id="date" type="date" required><select id="type"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select><input id="category" placeholder="Kategori (makan, gaji...)" required><input id="note" placeholder="Keterangan"><input id="amount" type="number" min="1" placeholder="Nominal Rp" required><button>Simpan</button></form><div class="controls"><input id="search" placeholder="Cari transaksi…"><button id="export">Export CSV</button><button id="backup">Backup JSON</button><label class="card" style="padding:8px">Import JSON <input id="import" type="file" accept=".json"></label></div><h2>Transaksi</h2><div style="overflow:auto"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><footer>Data disimpan di browser perangkat ini (localStorage). Backup berkala. Versi MVP.</footer></main>
<script>
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);let tx=JSON.parse(localStorage.arusTx||'[]');$('date').value=new Date().toISOString().slice(0,10);
function save(){localStorage.arusTx=JSON.stringify(tx);render()}
function render(){let q=$('search').value.toLowerCase(),list=tx.filter(t=>(t.category+' '+t.note).toLowerCase().includes(q)),inc=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),exp=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);$('income').textContent=fmt(inc);$('expense').textContent=fmt(exp);$('balance').textContent=fmt(inc-exp);$('rows').innerHTML=list.slice().reverse().map(t=>'<tr><td>'+t.date+'</td><td>'+ (t.type==='income'?'Pemasukan':'Pengeluaran')+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.note)+'</td><td class="'+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'-')+fmt(t.amount)+'</td><td><button onclick="del(\''+t.id+'\')">Hapus</button></td></tr>').join('')||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function del(id){if(confirm('Hapus transaksi?')){tx=tx.filter(t=>t.id!==id);save()}}
$('form').onsubmit=e=>{e.preventDefault();tx.push({id:crypto.randomUUID(),date:$('date').value,type:$('type').value,category:$('category').value,note:$('note').value,amount:Number($('amount').value)};e.target.reset();$('date').value=new Date().toISOString().slice(0,10);save()};
$('search').oninput=render;$('export').onclick=()=>{let csv='tanggal,jenis,kategori,keterangan,nominal\n'+tx.map(t=>[t.date,t.type,t.category,t.note,t.amount].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='arus-transaksi.csv';a.click()};
$('backup').onclick=()=>download(JSON.stringify(tx,null,2),'arus-backup.json');function download(s,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download=n;a.click()}
$('import').onchange=async e=>{try{tx=JSON.parse(await e.target.files[0].text());save()}catch{alert('File JSON tidak valid')}};render();
</script></body></html>
