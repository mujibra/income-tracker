<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#124734"><title>Catat Transaksi</title><link rel="manifest" href="./manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#17352a;font:16px system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:24px 18px 40px}header{margin:10px 0 24px}h1{font-size:27px;margin:0}p{color:#698075;margin:6px 0}form{background:white;border:1px solid #e0ebe4;border-radius:18px;padding:20px;display:grid;gap:15px;box-shadow:0 8px 30px #163d2610}label{font-size:13px;font-weight:650;color:#456457;display:grid;gap:7px}input,select,textarea{width:100%;font:inherit;padding:14px;border:1px solid #d6e3da;border-radius:11px;background:#fff;color:#18372a;outline-color:#22815a}textarea{resize:vertical;min-height:75px} .types{display:grid;grid-template-columns:1fr 1fr;gap:9px}.types label{display:block}.types input{position:absolute;opacity:0;width:1px}.types span{display:block;text-align:center;padding:13px;border:1px solid #d6e3da;border-radius:11px}.types input:checked+span{background:#e2f4e9;border-color:#208354;color:#17613d;font-weight:700}button{border:0;border-radius:12px;padding:15px;background:#176b48;color:white;font-weight:700;font-size:16px}button:disabled{opacity:.55}#status{text-align:center;min-height:24px;font-size:14px}.hint{font-size:12px;text-align:center;margin-top:15px}
</style></head><body><main><header><h1>Catat transaksi</h1><p>Input cepat langsung ke Google Sheets.</p></header><form id="form"><label>Tanggal<input id="date" type="date" required></label><label>Jenis transaksi<div class="types"><label><input type="radio" name="type" value="income" checked><span>＋ Pemasukan</span></label><label><input type="radio" name="type" value="expense"><span>− Pengeluaran</span></label></div></label><label>Kategori<select id="category" required><option value="">Pilih kategori</option><option>Gaji</option><option>Bonus</option><option>Makanan</option><option>Transportasi</option><option>Belanja</option><option>Tagihan</option><option>Anak & keluarga</option><option>Cicilan</option><option>Tabungan</option><option>Investasi</option><option>Hiburan</option><option>Lainnya</option></select></label><label>Nominal (Rp)<input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="Contoh: 25000" required></label><label>Keterangan<textarea id="note" placeholder="Opsional"></textarea></label><button id="save" type="submit">Simpan transaksi</button><div id="status" role="status"></div></form><p class="hint">Pastikan koneksi internet aktif saat menyimpan.</p></main><script>
const $=id=>document.getElementById(id);$('date').value=new Date().toLocaleDateString('sv-SE');
const endpoint=localStorage.txEndpoint||'',secret=localStorage.txSecret||'';
$('form').onsubmit=async e=>{e.preventDefault();if(!endpoint||!secret){$('status').textContent='Konfigurasi belum tersedia. Hubungi admin aplikasi.';return}
const b=$('save');b.disabled=true;b.textContent='Menyimpan…';$('status').textContent='';
const data={token:secret,date:$('date').value,type:document.querySelector('input[name=type]:checked').value,category:$('category').value,amount:Number($('amount').value),note:$('note').value.trim()};
try{const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const out=await res.json();if(!out.ok)throw Error(out.error||'Gagal menyimpan');$('status').textContent='✓ Transaksi tersimpan di Google Sheets';$('amount').value='';$('note').value='';$('category').value='';}catch(err){$('status').textContent='Gagal menyimpan. Cek internet atau konfigurasi Apps Script.'}finally{b.disabled=false;b.textContent='Simpan transaksi'}
};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
